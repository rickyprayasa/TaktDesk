name: takt_desk
description: "ZYKL: Pomodoro Focus Timer - an analog focus instrument for Android by RSQUARE"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  clock: ^1.1.1
  drift: ^2.35.2
  path_provider: ^2.1.3
  path: ^1.9.0
  sensors_plus: ^7.1.1
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
