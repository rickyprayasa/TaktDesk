# Sized for the dev machine (4 cores / 7.6 GB RAM). -Xmx8G exceeded physical RAM
# and froze the PC; 3 GB is enough for debug builds and the R8 release build.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.daemon.idletimeout=600000
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Compile Kotlin inside the Gradle JVM (no separate ~1 GB Kotlin daemon)
kotlin.compiler.execution.strategy=in-process
